px;padding:0}.profile-row{border-top:1px solid var(--line);padding:15px 6px 0;display:flex;align-items:center;gap:10px}.profile-pic{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#f4d5bd,#bbd2f9);display:grid;place-items:center;color:#4a5065;font-weight:750;font-size:11px}.profile-name{font-size:12px;font-weight:680}.profile-role{font-size:10px;color:var(--muted);margin-top:2px}.profile-more{margin-left:auto}

/* Orbit Personal — Equa-inspired charcoal dashboard refresh */
:root{
  color-scheme:light;
  --bg:#f5f5f7;--surface:#ffffff;--surface-2:#fafafd;--surface-3:#efeff3;
  --text:#27272b;--muted:#84848f;--line:#e6e6ec;--accent:#7753d7;--accent-2:#eee8ff;
  --accent-text:#fff;--green:#24987b;--green-bg:#e4f6ef;--orange:#c8792b;--orange-bg:#fff1df;
  --red:#cf4c63;--red-bg:#ffedf0;--purple:#8b68e8;--shadow:0 12px 30px rgba(20,20,28,.06);
  --sidebar:#fbfbfd;--radius:15px
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09090b;--surface:#222224;--surface-2:#19191b;--surface-3:#111113;
  --text:#f3f3f5;--muted:#a0a0a8;--line:#343438;--accent:#8a68f6;--accent-2:#302548;
  --accent-text:#fff;--green:#58c9a6;--green-bg:#1b382f;--orange:#ff782e;--orange-bg:#3a251b;
  --red:#ff8294;--red-bg:#3b2028;--purple:#b19aff;--shadow:0 14px 34px rgba(0,0,0,.28);
  --sidebar:#18181a
}
body{background:var(--bg)}

.nav-item.active{background:linear-gradient(105deg,#8d6afa,#6f4ec6);color:#fff;box-shadow:none}
.nav-item.active svg{color:#fff}
.primary-btn{background:linear-gradient(105deg,#8a68f6,#7048ca);border-color:transparent;color:#fff;box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 18%,transparent)}

.card:hover{border-color:color-mix(in srgb,var(--accent) 28%,var(--line));box-shadow:var(--shadow)}

.habit-month-title{margin:0;font-size:14px;font-weight:760;letter-spacing:-.2px}

.habit-month-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.habit-month-label{font-size:13px;font-weight:750;min-width:125px;text-align:center;color:var(--text)}
.habit-month-current{white-space:nowrap;padding:8px 10px;font-size:11px}
.habit-month-scroll{width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px;overscroll-behavior-x:contain;background:var(--surface);scrollbar-width:thin}
.habit-month-grid{display:grid;grid-template-columns:190px repeat(var(--habit-days,31),34px);width:max-content;min-width:100%;align-items:stretch}
.habit-month-grid>*{min-height:44px;border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);display:flex;align-items:center;justify-content:center;padding:4px}

.habit-month-label-head{z-index:4;background:var(--surface-2);font-size:10px;font-weight:760;color:var(--muted);padding-left:13px;box-shadow:1px 0 0 var(--line)}
.habit-month-day-head{background:var(--surface-2);flex-direction:column;gap:1px;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--text)}
.habit-month-day-head small{font-size:8px;font-weight:550;color:var(--muted);text-transform:uppercase}
.habit-month-day-head.today{background:var(--accent-2);color:var(--accent)}
.habit-month-day-head.future{color:var(--muted);opacity:.65}
.habit-month-habit{gap:8px;padding:6px 9px 6px 12px;box-shadow:1px 0 0 var(--line)}
.habit-month-color{width:8px;height:8px;border-radius:50%;flex:none}
.habit-month-habit-copy{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.habit-month-habit-copy strong{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:124px}
.habit-month-habit-copy span{font-size:9px;color:var(--muted);white-space:nowrap}
.habit-month-delete{width:25px;height:25px;opacity:.65;flex:none}
.habit-month-cell{background:var(--surface)}
.habit-month-check{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:white;padding:0;transition:background .12s,border-color .12s,transform .12s}
.habit-month-check svg{width:13px;height:13px;stroke-width:2.4}
.habit-month-check:hover:not(:disabled){border-color:var(--habit-color,var(--accent));transform:translateY(-1px)}
.habit-month-check.done{background:var(--habit-color,var(--accent));border-color:var(--habit-color,var(--accent));box-shadow:0 2px 8px color-mix(in srgb,var(--habit-color,var(--accent)) 20%,transparent)}
.habit-month-check.today{outline:1.5px solid var(--accent);outline-offset:2px}
.habit-month-check:disabled{opacity:.32;cursor:not-allowed;background:var(--surface-3)}
.habit-month-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:10px}
.habit-month-legend span{display:inline-flex;align-items:center;gap:6px}
.habit-legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--surface-3);border:1px solid var(--line)}
.habit-legend-dot.completed{background:var(--accent);border-color:var(--accent)}
.habit-legend-dot.current{background:var(--surface);border:1.5px solid var(--accent)}
.pwa-install-row .secondary-btn{white-space:nowrap;flex:none}
@media(max-width:760px){.habit-month-toolbar{flex-direction:column;align-items:stretch}.habit-month-controls{justify-content:flex-start}.habit-month-label{min-width:0;flex:1}.habit-month-grid{grid-template-columns:150px repeat(var(--habit-days,31),32px)}.habit-month-grid>*{min-height:42px}.habit-month-habit{padding-left:9px;gap:6px}.habit-month-habit-copy strong{max-width:86px}.habit-month-delete{width:22px;height:22px}.habit-month-check{width:24px;height:24px}.habit-month-summary.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.habit-month-summary .summary-card{padding:12px 10px}.habit-month-summary .summary-num{font-size:22px}.habit-month-summary .summary-top{gap:6px}.habit-month-summary .summary-top>span:first-child{font-size:10px}.pwa-install-row{align-items:flex-start}}
@media(max-width:450px){.habit-month-summary.grid-3{grid-template-columns:1fr}.habit-month-summary .summary-card{min-height:auto}.habit-month-summary .summary-num{font-size:24px}.habit-month-controls .icon-btn{width:34px;height:34px}}

="crumb-current">${view==='project'?esc(projectName(selectedProjectId)||'Proyek'):esc(navItems.find(n=>n.id===view)?.label||'Ringkasan')}</span></div><div class="top-actions"><button class="search-trigger" data-action="open-search">${icon('search')}<span class="search-text">Cari apa saja...</span><kbd>⌘ K</kbd></button><button class="icon-btn" data-action="toggle-theme" title="Ganti tema" aria-label="Ganti tema">${icon(state.settings.theme==='dark'?'sun':'moon')}</button><button class="icon-btn" data-action="new-task" title="Tugas baru" aria-label="Tugas baru">${icon('plus')}</button></div></header><div class="page-content" id="page-content">${renderPage()}</div></main></div>`}
function heading(title,subtitle='',action='new-task',actionLabel='Tugas baru',eyebrow='WORKSPACE'){return `<div class="page-heading"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${title}</h1>${subtitle?`<p class="page-subtitle">${subtitle}</p>`:''}</div>${action?`<button class="primary-btn" data-action="${action}">${icon(action==='new-task'?'plus':action==='new-note'?'plus':'plus')}${esc(actionLabel)}</button>`:''}</div>`}
function taskRow(t,archived=false){const p=projectById(t.projectId);const isDone=t.status==='done';const progress=taskProgress(t);const warning=taskScheduleWarning(t);let statusText=t.status==='doing'?'Sedang dikerjakan':isDone?'Selesai':'Belum mulai';return `<div class="task-row" data-task-row="${esc(t.id)}"><button class="task-check ${isDone?'checked':''}" data-action="toggle-task" data-id="${esc(t.id)}" title="Tandai selesai" aria-label="Tandai ${esc(t.title)} selesai">${icon('check')}</button><div class="task-main"><div class="task-title ${isDone?'is-done':''}">${esc(t.title)}</div><div class="task-meta"><span><i class="priority-dot priority-${esc(t.priority)}"></i>${taskPriorityLabel(t.priority)}</span>${t.startDate||t.due?`<span class="task-meta-range">${icon('calendar')} ${esc(taskRangeLabel(t))}</span>`:''}${p?`<span><i class="project-dot" style="background:${esc(p.color)};width:6px;height:6px"></i>${esc(p.name)}</span>`:''}${t.tags?.slice(0,2).map(tag=>`<span>${icon('hash')}${esc(tag)}</span>`).join('')||''}</div>${t.progressMode==='checklist'&&t.checklist?.length?`<div class="task-progress-block"><div class="task-progress-track"><span style="width:${progress}%"></span></div><div class="task-progress-label">${t.checklist.filter(x=>x.done).length}/${t.checklist.length} subtugas selesai · ${progress}%</div></div>`:t.progressMode!=='checklist'&&progress>0&&!isDone?`<div class="task-progress-block"><div class="task-progress-track"><span style="width:${progress}%"></span></div><div class="task-progress-label">Progres ${progress}%</div></div>`:''}${warning?`<div class="${warning.type==='overdue'?'task-overdue-warning':'task-lag-warning'}">${icon(warning.type==='overdue'?'clock':'sparkle')} ${esc(warning.text)}</div>`:''}${t.checklist?.length?`<div class="task-checklist-preview">${t.checklist.slice(0,3).map(x=>`<button class="task-checklist-pill ${x.done?'done':''}" data-action="toggle-checklist" data-id="${esc(t.id)}" data-subid="${esc(x.id)}">${x.done?'✓':'○'} ${esc(x.text)}</button>`).join('')}${t.checklist.length>3?`<span class="task-checklist-pill">+${t.checklist.length-3}</span>`:''}</div>`:''}</div><div class="task-trailing"><span class="pill ${t.status==='doing'?'pill-blue':isDone?'pill-green':'pill-orange'}">${statusText}</span><div class="task-actions"><button class="mini-icon" data-action="edit-task" data-id="${esc(t.id)}" title="Edit tugas">${icon('edit')}</button>${archived?`<button class="mini-icon" data-action="restore-task" data-id="${esc(t.id)}" title="Kembalikan dari arsip">${icon('reset')}</button>`:`<button class="mini-icon" data-action="archive-task" data-id="${esc(t.id)}" title="Arsipkan">${icon('archive')}</button>`}<button class="mini-icon" data-action="delete-task" data-id="${esc(t.id)}" title="Hapus tugas">${icon('trash')}</button></div></div></div>`}
function todayTasks(){return tasksActive().filter(t=>t.due===dateKey()).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])))}
function renderOrbitInsight(){const open=tasksActive().filter(t=>t.status!=='done');const overdue=open.filter(t=>t.due&&t.due<dateKey());const dueToday=open.filter(t=>t.due===dateKey());const high=open.filter(t=>t.priority==='high');const ranked=[...open].sort((a,b)=>{const score=t=>((t.due&&t.due<dateKey())?100:0)+(t.due===dateKey()?50:0)+(t.priority==='high'?25:t.priority==='medium'?10:0)+(t.status==='doing'?5:0);return score(b)-score(a)});let title='Mulai dengan satu langkah kecil';let copy='Belum ada cukup informasi untuk menyusun rekomendasi. Tambahkan tugas beserta prioritas atau tenggat agar Orbit bisa membantu mengurutkannya.';let meta=`${open.length} tugas terbuka · rekomendasi berdasarkan data lokal`;if(overdue.length){title=`Periksa ${overdue.length} tugas yang melewati tenggat`;copy=`Mulai dari “${overdue.slice().sort((a,b)=>a.due.localeCompare(b.due))[0].title}”. Tinjau apakah tenggat perlu diselesaikan atau dijadwalkan ulang.`}else if(dueToday.length){title=`Fokus pada ${dueToday.length} tugas yang jatuh tempo hari ini`;copy=`Prioritaskan “${(ranked.find(t=>t.due===dateKey())||ranked[0]).title}” terlebih dahulu, terutama jika tugas itu berdampak besar.`}else if(high.length){title=`Ada ${high.length} tugas prioritas tinggi`;copy=`Pertimbangkan mulai dari “${high[0].title}”, lalu pilih satu pekerjaan berikutnya setelahnya.`}else if(open.length){title='Rencanakan satu tugas berikutnya';copy=`“${ranked[0].title}” adalah kandidat awal berdasarkan status, prioritas, dan tenggat yang tersedia.`}else{title='Semua tugas terbuka sudah beres';copy='Nikmati jeda atau tambahkan tugas berikutnya jika ada hal baru yang perlu dikerjakan.';meta='0 tugas terbuka · progres dihitung dari data lokal'}return `<section class="insight-card"><div class="insight-icon">${icon('sparkle')}</div><div><div class="insight-title">Orbit Insight <span class="pill pill-blue" style="margin-left:5px">Lokal</span></div><p class="insight-copy"><strong style="color:var(--text)">${esc(title)}</strong><br>${esc(copy)}</p><div class="insight-meta">${esc(meta)}</div></div><button class="secondary-btn insight-cta" data-view="tasks">Tinjau tugas ${icon('chevron')}</button></section>`}
function renderDashboard(){
  const cnt=taskCounts();

  const today=dateKey();
  const hour=new Date().getHours();
  const greeting=hour<11?'Selamat pagi':hour<15?'Selamat siang':hour<18?'Selamat sore':'Selamat malam';

  const completedToday=tasksActive().filter(t=>t.status==='done'&&(t.completedAt||t.updatedAt)&&dateKey(new Date(t.completedAt||t.updatedAt))===today).length;
  const week=Array.from({length:7},(_,i)=>shiftDate(today,i-6));
  const weeklyCounts=week.map(day=>tasksActive().filter(t=>t.status==='done'&&(t.completedAt||t.updatedAt)&&dateKey(new Date(t.completedAt||t.updatedAt))===day).length);
  const totalWeekly=weeklyCounts.reduce((a,b)=>a+b,0);
  const upcoming=open.filter(t=>t.due&&t.due>=today&&t.due<=shiftDate(today,7)).length;
  const maxValue=Math.max(1,...weeklyCounts);

  const chartBars=weeklyCounts.map((v,i)=>{const h=v?Math.max(5,v/maxValue*78):0;const x=31+i*62;return `<rect class="chart-bar" x="${x}" y="${132-h}" width="28" height="${h}" rx="5"><title>${esc(fmtDate(week[i],{weekday:'long',day:'numeric',month:'short'}))}: ${v} tugas selesai</title></rect>`}).join('');
  const chartGrid=[0,1,2,3].map(i=>`<line class="chart-gridline" x1="25" y1="${54+i*26}" x2="452" y2="${54+i*26}"/>`).join('');
  const chartLabels=week.map((day,i)=>`<text class="chart-label" x="${45+i*62}" y="157" text-anchor="middle">${esc(fmtDate(day,{weekday:'short'}).slice(0,3))}</text>`).join('');
  const f=state.focus;
  const timerPct=100*f.remaining/Math.max(1,f.duration);
  const timerText=`${String(Math.floor(f.remaining/60)).padStart(2,'0')}:${String(f.remaining%60).padStart(2,'0')}`;
  const projectStats=state.projects.map(p=>{const tasks=tasksActive().filter(t=>t.projectId===p.id);const done=tasks.filter(t=>t.status==='done').length;return {...p,total:tasks.length,done,pct:tasks.length?Math.round(done/tasks.length*100):0}}).slice(0,3);
  const safeTasks=open.filter(t=>(!t.startDate||t.startDate<=today)&&(!t.due||t.due>=today)).sort((a,b)=>{
    const rank={high:0,medium:1,low:2};

    if(priority)return priority;
    if(a.due&&b.due&&a.due!==b.due)return a.due.localeCompare(b.due);
    if(a.due&&!b.due)return -1;
    if(!a.due&&b.due)return 1;
    return 0;
  }).slice(0,5);
  return `<div class="dash-heading eq-dash-heading"><div><h1 class="dash-welcome">${greeting}!</h1><p class="dash-date">${esc(dayLabel)} · Satu langkah kecil tetap berarti.</p></div><div class="dash-heading-actions"><button class="primary-btn" data-action="new-task">${icon('plus')} Tugas baru</button></div></div>
  <div class="eq-dashboard-grid">
    <div class="eq-main-column">
      <div class="dash-kpis">
        <div class="card dash-kpi"><div class="dash-kpi-icon">${icon('list')}</div><div><div class="dash-kpi-label">Tugas aktif</div><div class="dash-kpi-value">${cnt.todo+cnt.doing}</div><div class="dash-kpi-note">${cnt.doing} sedang dikerjakan</div></div></div>
        <div class="card dash-kpi"><div class="dash-kpi-icon">${icon('calendar')}</div><div><div class="dash-kpi-label">Tenggat dekat</div><div class="dash-kpi-value">${upcoming}</div><div class="dash-kpi-note">Dalam 7 hari</div></div></div>
        <div class="card dash-kpi"><div class="dash-kpi-icon">${icon('checkCircle')}</div><div><div class="dash-kpi-label">Selesai hari ini</div><div class="dash-kpi-value">${completedToday}</div><div class="dash-kpi-note">${totalWeekly} dalam 7 hari</div></div></div>
      </div>
      <div class="eq-main-widgets">
        <section class="card dash-panel eq-chart-panel"><div class="dash-panel-head"><div><h2 class="dash-panel-title">Produktivitas</h2><p class="dash-panel-subtitle">Tugas selesai dalam 7 hari terakhir</p></div><span class="pill pill-blue">7 hari</span></div>${totalWeekly?`<svg class="productivity-chart-svg" viewBox="0 0 470 170" role="img" aria-label="Grafik tugas selesai selama tujuh hari">${chartGrid}${chartBars}<polyline class="chart-trend" points="${points}"/>${weeklyCounts.map((v,i)=>`<circle class="chart-point" cx="${42+i*62}" cy="${132-(v/maxValue)*78}" r="3.3"/>`).join('')}${chartLabels}</svg><div class="dash-panel-subtitle eq-chart-caption">${totalWeekly} tugas selesai menurut data lokal.</div>`:`<div class="eq-chart-empty"><div class="empty-illustration">${icon('zap')}</div><strong>Grafikmu dimulai di sini</strong><span>Tugas yang selesai akan membentuk tren mingguan.</span></div>`}</section>
        <section class="card dash-panel eq-timer-panel"><div class="dash-panel-head"><div><h2 class="dash-panel-title">Focus Timer</h2><p class="dash-panel-subtitle">Fokus tanpa pindah halaman</p></div><button class="mini-icon" data-view="focus" title="Pengaturan timer">${icon('settings')}</button></div><div class="dash-timer eq-dash-timer"><div class="dash-timer-ring eq-timer-ring" id="timer-shell" style="--timer-value:${timerPct}%"><div class="dash-timer-inner"><div class="dash-timer-time" id="timer-display">${timerText}</div><div class="dash-timer-state">${f.running?'Sedang fokus':f.remaining===0?'Sesi selesai':'Siap fokus'}</div></div></div><div class="dash-timer-actions"><button class="primary-btn" data-action="focus-toggle">${icon(f.running?'pause':'play')} ${f.running?'Jeda':f.duration===900?'Mulai istirahat':'Mulai fokus'}</button><button class="secondary-btn" data-action="focus-reset" title="Reset timer">${icon('reset')}</button></div><div class="dash-duration-row">${[[1500,'25 mnt'],[3000,'50 mnt'],[900,'15 mnt']].map(([sec,label])=>`<button class="duration-btn ${f.duration===sec?'active':''}" data-action="focus-duration" data-seconds="${sec}">${label}</button>`).join('')}</div></div></section>
      </div>
      <section class="card dash-panel eq-project-panel"><div class="dash-panel-head"><div><h2 class="dash-panel-title">Proyek berjalan</h2><p class="dash-panel-subtitle">Ringkasan progres proyekmu</p></div><button class="dash-text-link" data-view="projects">Lihat semua ${icon('chevron')}</button></div>${projectStats.length?`<div class="eq-project-list">${projectStats.map(p=>`<button class="eq-project-row" data-action="open-project" data-id="${esc(p.id)}"><span class="eq-project-dot" style="background:${esc(p.color)}"></span><span class="eq-project-main"><span class="eq-project-head"><strong>${esc(p.name)}</strong><span>${p.pct}%</span></span><span class="eq-project-meta">${p.done} dari ${p.total} tugas selesai</span><span class="eq-project-track"><span style="width:${p.pct}%;background:${esc(p.color)}"></span></span></span>${icon('chevron')}</button>`).join('')}</div>`:`<div class="eq-empty-line">Belum ada proyek. Buat proyek untuk mengelompokkan tugas yang berkaitan.</div><button class="secondary-btn" data-action="new-project">${icon('plus')} Proyek baru</button>`}</section>
    </div>
    <aside class="eq-side-column">
      <section class="card dash-panel eq-today-panel"><div class="dash-panel-head"><div><h2 class="dash-panel-title">Fokus hari ini</h2><p class="dash-panel-subtitle">Pekerjaan yang sedang relevan</p></div><button class="dash-text-link" data-view="tasks">Lihat semua ${icon('chevron')}</button></div>${safeTasks.length?`<div class="eq-focus-list">${safeTasks.map(t=>`<div class="eq-focus-item"><button class="dash-task-check ${t.status==='done'?'checked':''}" data-action="toggle-task" data-id="${esc(t.id)}" aria-label="Tandai ${esc(t.title)} selesai">${t.status==='done'?icon('check'):''}</button><div class="eq-focus-copy"><div class="dash-task-title ${t.status==='done'?'done':''}">${esc(t.title)}</div><div class="dash-task-meta"><span class="dash-task-priority ${esc(t.priority)}">${taskPriorityLabel(t.priority)}</span><span>${esc(t.due?dueLabel(t.due):'Tanpa tenggat')}</span></div>${t.due&&t.due<today?'<div class="task-overdue-warning">Terlambat · belum selesai</div>':''}</div><button class="mini-icon eq-focus-edit" data-action="edit-task" data-id="${esc(t.id)}" title="Edit tugas">${icon('edit')}</button></div>`).join('')}</div>`:`<div class="eq-empty-line">Belum ada tugas yang perlu difokuskan. Tambahkan tugas atau cek Inbox jika ada ide baru.</div><button class="secondary-btn" data-action="new-task">${icon('plus')} Tambah tugas</button>`}</section>
      ${renderOrbitInsight()}

  </div>`;
}
function renderInboxPage(){const entries=state.inbox.filter(x=>inboxFilter==='all'||x.type===inboxFilter).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `${heading('Inbox','Tempat menangkap ide dan tugas sebelum kamu memutuskan kapan mengerjakannya.','new-inbox-item','Tambah item','CAPTURE')}<div class="inbox-type-tabs">${[['all','Semua'],['task','Tugas'],['note','Catatan']].map(([id,label])=>`<button class="inbox-type-tab ${inboxFilter===id?'active':''}" data-action="inbox-filter" data-filter-inbox="${id}">${label}${id==='all'?` (${state.inbox.length})`: ` (${state.inbox.filter(x=>x.type===id).length})`}</button>`).join('')}</div>${entries.length?`<div class="inbox-grid">${entries.map(x=>`<article class="card inbox-card"><div class="inbox-card-top"><div class="inbox-card-icon">${icon(x.type==='task'?'list':'note')}</div><span class="pill pill-blue">${x.type==='task'?'Tugas':'Catatan'}</span></div><div class="inbox-card-title">${esc(x.title)}</div>${x.content?`<div class="inbox-card-copy">${esc(x.content.slice(0,500))}${x.content.length>500?'…':''}</div>`:''}<div class="inbox-card-foot"><span class="small muted">${esc(fmtDate(dateKey(new Date(x.createdAt)),{day:'numeric',month:'short'}))}</span><div style="display:flex;gap:6px">${x.type==='task'?`<button class="primary-btn" data-action="move-inbox-task" data-id="${esc(x.id)}">Jadikan tugas ${icon('chevron')}</button>`:''}<button class="mini-icon" data-action="delete-inbox-item" data-id="${esc(x.id)}" title="Hapus item">${icon('trash')}</button></div></div></article>`).join('')}</div>`:`<div class="card" style="padding:34px 20px;text-align:center"><div class="empty-illustration" style="margin:0 auto 12px">${icon('inbox')}</div><h2 style="font-size:15px;margin:0 0 7px">Inbox masih kosong</h2><p class="muted small" style="max-width:370px;margin:0 auto 16px">Simpan hal yang baru terpikirkan. Tambahkan tanggal nanti setelah kamu siap mengubah tugas menjadi bagian dari rencana.</p><button class="p function getFilteredTasks(mode=view){let list=tasksActive();if(mode==='inbox')list=list.filter(t=>!t.projectId);if(mode==='archive')list=state.tasks.filter(t=>t.archived);if(mode==='project')list=list.filter(t=>t.projectId===selectedProjectId);if(mode==='tasks'){if(taskFilter==='today')list=list.filter(t=>t.due===dateKey());if(taskFilter==='upcoming')list=list.filter(t=>t.due&&t.due>dateKey()&&t.status!=='done');if(taskFilter==='done')list=list.filter(t=>t.status==='done');if(taskFilter==='all'){} }if(taskSearch.trim()){const q=taskSearch.toLowerCase();list=list.filter(t=>[t.title,t.details,t.tags.join(' '),projectName(t.projectId)].join(' ').toLowerCase().includes(q))}return list.sort((a,b)=>{if(a.status==='done'&&b.status!=='done')return 1;if(b.status==='done'&&a.status!=='done')return -1;if(a.due&&b.due&&a.due!==b.due)return a.due.localeCompare(b.due);if(a.due&&!b.due)return -1;if(!a.due&&b.due)return 1;return ({high:0,medium:1,low:2}[a.priority]??1)-({high:0,medium:1,low:2}[b.priority]??1)})}

function renderProjects(){return `${heading('Proyek','Kumpulkan tugas berdasarkan area kerja, minat, atau tanggung jawab.','new-project','Proyek baru','ORGANISASI')}<div class="project-grid">${state.projects.map(p=>{const list=tasksActive().filter(t=>t.projectId===p.id),done=list.filter(t=>t.status==='done').length,percent=list.length?Math.round(done/list.length*100):0;return `<div class="card project-card" data-action="open-project" data-id="${esc(p.id)}" role="button" tabindex="0"><div class="project-card-top"><div class="project-icon" style="background:${esc(p.color)}20;color:${esc(p.color)}">${icon('folder')}</div><button class="mini-icon" data-action="edit-project" data-id="${esc(p.id)}" title="Edit proyek">${icon('more')}</button></div><h3>${esc(p.name)}</h3><p>${esc(p.description||'Ruang proyek untuk tugas dan catatan terkait.')}</p><div class="mini-progress"><span style="width:${percent}%;background:${esc(p.color)}"></span></div><div class="project-card-foot"><span>${list.length} tugas · ${done} selesai</span><span>${percent}%</span></div></div>`}).join('')}<button class="card project-card" data-action="new-project" style="border-style:dashed;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)"><div class="empty-illustration">${icon('plus')}</div><strong style="font-size:12px;color:var(--text)">Proyek baru</strong><span class="small" style="margin-top:5px">Buat ruang kerja baru</span></button></div>`}

function markdownToHtml(source=''){let s=esc(source);s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.*)$/gm,'<li>$1</li>');s=s.replace(/(<li>.*<\/li>\n?)+/gs,m=>`<ul>${m}</ul>`);return s.split(/\n{2,}/).map(part=>/^(<h[1-3]|<ul>|<blockquote>)/.test(part.trim())?part:part.replace(/\n/g,'<br>')).join('<br>')}
function renderCalendar(){const year=monthCursor.getFullYear(),month=monthCursor.getMonth(),first=new Date(year,month,1),startOffset=(first.getDay()+6)%7,start=new Date(year,month,1-startOffset),active=tasksActive();let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=dateKey(d),tasks=active.filter(t=>(t.startDate&&t.due&&t.startDate<=key&&key<=t.due)||t.due===key),isToday=key===dateKey(),isSelected=key===selectedDate;cells+=`<button class="calendar-day ${d.getMonth()!==month?'other-month':''} ${isToday?'today':''} ${isSelected?'selected':''}" data-action="calendar-day" data-date="${key}" aria-label="${niceDate(key)}"><span class="day-number">${d.getDate()}</span><span class="day-dots">${tasks.slice(0,3).map(t=>`<i class="day-dot ${t.due===key?'day-dot-deadline':t.status==='done'?'done':'day-dot-range'}" title="${t.due===key?'Tenggat: ':'Dalam rentang: '}${esc(t.title)}"></i>`).join('')}</span></button>`;}const chosen=active.filter(t=>(t.startDate&&t.due&&t.startDate<=selectedDate&&selectedDate<=t.due)||t.due===selectedDate).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])));return `${heading('Kalender','Pahami rentang kerja dan tenggat dalam tampilan bulanan.','add-calendar-task','Tugas di tanggal ini','PLANNING')}<div class="calendar-layout"><section class="card calendar-card"><div class="calendar-top"><div class="calendar-month">${monthCursor.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</div><div class="calendar-nav"><button class="icon-btn" data-action="calendar-prev" aria-label="Bulan sebelumnya">${icon('left')}</button><button class="icon-btn" data-action="calendar-today">${icon('target')}</button><button class="icon-btn" data-action="calendar-next" aria-label="Bulan berikutnya">${icon('right')}</button></div></div><div class="calendar-weekdays">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('')}</div><div clas function habitLogDates(habit){const today=dateKey();return Object.keys(habit?.logs||{}).filter(k=>habit.logs[k]&&/^\d{4}-\d{2}-\d{2}$/.test(k)&&dateKey(dateFromKey(k))===k&&k<=today).sort()}

function renderHabits(){

  }).join('');

    <div class="grid-3 habit-month-summary" style="margin-bottom:18px">

      ${state.habits.length?`<div class="habit-month-scroll" role="region" aria-label="Pelacakan kebiasaan ${esc(monthLabel)}" tabindex="0"><div class="habit-month-grid" style="--habit-days:${daysInMonth}"><div class="habit-month-label-head">Kebiasaan / tanggal</div>${keys.map(k=>{const d=dateFromKey(k);return `<div class="habit-month-day-head ${k===today?'today':''} ${k>today?'future':''}"><span>${d.getDate()}</span><small>${fmtDate(k,{weekday:'short'}).slice(0,2)}</small></div>`}).join('')}${habitRows}</div></div><div class="habit-month-legend"><span><i class="habit-legend-dot completed"></i>Selesai</span><span><i class="habit-legend-dot missed"></i>Belum ditandai</span><span><i class="habit-legend-dot current"></i>Hari ini</span></div>`:emptyState('Mulai dengan satu kebiasaan','Tambahkan kebiasaan pertamamu. Setelah itu, kamu bisa melacak setiap hari dan berpindah antarbulan.','new-habit','Buat kebiasaan')}

 value="doing" ${t.status==='doing'?'selected':''}>Sedang dikerjakan</option><option value="done" ${t.status==='done'?'selected':''}>Selesai</option></select></div></div><div class="field"><label for="task-tags">Tag (opsional)</label><input id="task-tags" name="tags" value="${esc((t.tags||[]).join(', '))}" placeholder="Contoh: penting, follow-up"/></div><div class="field"><label for="task-checklist">Checklist subtugas (opsional, satu per baris)</label><textarea id="task-checklist" name="checklistText" placeholder="Riset kebutuhan\nBuat draf\nTinjau hasil">${esc((t.checklist||[]).map(x=>(x.done?'[x] ':'')+x.text).join('\n'))}</textarea><span class="field-hint">Checklist subtugas akan menghitung progres otomatis.</span></div></form>`;$('#modal-root').innerHTML=modalFrame(id?'Edit tugas':'Tugas baru',editingInboxId?'Pilih tanggal mulai dan tenggat untuk memindahkan item Inbox.':'Tambahkan rentang kerja. Checklist subtugas akan menghitung progres otomatis.',body,id?'Simpan perubahan':'Buat tugas');$('#task-title')?.focus();const startEl=$('#task-start'),dueEl=$('#task-due');startEl?.addEventListener('change',()=>{if(startEl.value)dueEl.min=startEl.value});dueEl?.addEventListener('change',()=>{if(dueEl.value)startEl.max=dueEl.value});if(startValue)dueEl.min=startValue;if(t.due)startEl.max=t.due}

function submitModal(form){const data=Object.fromEntries(new FormData(form).entries());if(modalType==='inbox'){const title=(data.title||'').trim();if(!title)return;state.inbox.unshift({id:uid(),title,content:(data.content||'').trim(),type:data.type==='note'?'note':'task',createdAt:new Date().toISOString()});saveState();closeModal();render();toast('Item ditambahkan ke Inbox');return}if(modalType==='task'){const title=(data.title||'').trim();if(!title){$('#task-title')?.focus();return}const startDate=data.startDate||'',due=data.due||'';if(!startDate||!due){alert('Pilih tanggal mulai dan tenggat tugas.');return}if(startDate>due){alert('Tanggal mulai tidak boleh setelah tenggat.');return}const now=new Date().toISOString();const existing=editingTaskId?state.tasks.find(t=>t.id===editingTaskId):null;const checklistLines=(data.checklistText||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,50);const checklist=checklistLines.map(line=>{const done=/^\[(x|✓)\]\s*/i.test(line);const text=line.replace(/^\[(x|✓| )\]\s*/i,'').trim();const previous=(existing?.checklist||[]).find(c=>c.text===text);return {id:previous?.id||uid(),text:text.slice(0,180),done}}).filter(x=>x.text);const payload={title,details:(data.details||'').trim(),startDate,due,priority:data.priority||'medium',status:data.status||'todo',progressMode:checklist.length?'checklist':(existing?.progressMode==='checklist'?'checklist':'manual'),progress:existing?Math.max(0,Math.min(100,Number(existing.progress)||0)):0,checklist,projectId:data.projectId||'',tags:(data.tags||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,12),updatedAt:now,archived:false};if(editingTaskId){if(existing){const wasDone=existing.status==='done';Object.assign(existing,payload);existing.completedAt=payload.status==='done'?(wasDone?(existing.completedAt||now):now):'';}toast('Perubahan tugas disimpan')}else{state.tasks.unshift({id:uid(),...payload,completedAt:payload.status==='done'?now:'',createdAt:now});if(editingInboxId)state.inbox=state.inbox.filter(x=>x.id!==editingInboxId);toast(editingInboxId?'Item dipindahkan ke Daftar Tugas':'Tugas baru ditambahkan')}saveState();closeModal();render();return}if(modalType==='project'){const name=(data.name||'').trim();if(!name)return;const id=data.id||uid();const existing=state.projects.find(p=>p.id===id);if(existing){Object.assign(existing,{name,description:(data.description||'').trim(),color:data.color||'#8064db'});toast('Proyek diperbarui')}else{state.projects.push({id,name,description:(data.description||'').trim(),color:data.color||'#8064db'});toast('Proyek dibuat')}saveState();closeModal();render();return}if(modalType==='habit'){const name=(data.name||'').trim();if(!name)return;state.habits.push({id:uid(),name,color:data.color||'#4a91ef',createdAt:new Date().toISOString(),logs:{}});saveState();closeModal();render();toast('Kebiasaan ditambahkan');return}if(modalType==='goal'){const title=(data.title||'').trim();if(!title)return;state.goals.push({id:uid(),title,description:(data.description||'').trim(),deadline:data.deadline||'',progress:Number(data.progress)||0});saveState();closeModal();render();toast('Tujuan disimpan');return}}

function updateNoteField(field,value){const n=state.notes.find(n=>n.id===selectedNote);if(!n)return;if(field==='tags')n.tags=value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20);else n[field]=value;n.updatedAt=new Date().toISOString();saveState();const status=$('#note-save-label');if(status)status.textContent='Tersimpan otomatis';const foot=$('.note-footer');if(foot){const words=(n.content||'').trim().split(/\s+/).filter(Boolean).length;foot.firstElementChild.textContent=`${words} kata · Diperbarui ${fmtDate(dateKey(new Date(n.updatedAt)),{day:'numeric',month:'long'})}`}const listItem=$(`.note-list-item[data-id="${CSS.escape(n.id)}"]`);if(listItem){const title=$('.note-list-title',listItem);if(title)title.innerHTML=`${n.pinned?icon('pin'):''}${esc(n.title||'Catatan tanpa judul')}`;const preview=$('.note-list-preview',listItem);if(preview)preview.textContent=(n.content||'Belum ada isi catatan.').replace(/[#*_>`\n]/g,' ').trim().slice(0,95)}}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'Orbit Personal'},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`orbit-cadangan-${dateKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Cadangan data diunduh')}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result));if(!data||typeof data!=='object'||!Array.isArray(data.tasks)||!Array.isArray(data.projects)||!Array.isArray(data.notes))throw new Error('Format file tidak dikenali');if(!confirm('Impor akan mengganti data saat ini. Pastikan kamu sudah membuat cadangan. Lanjutkan?'))return;state=normalizeState(data);selectedNote=state.notes[0]?.id||null;selectedProjectId=null;if(focusInterval){clearInterval(focusInterval);focusInterval=null}saveState();closeModal();render();if(state.focus.running)startTimerInterval();toast('Cadangan berhasil dipulihkan')}catch(e){alert('File tidak dapat diimpor. Pilih file cadangan JSON dari Orbit yang valid.')}finally{$('#import-file').value=''}};reader.readAsText(file)}
function timerStart(){if(state.focus.remaining<=0)state.focus.remaining=state.focus.duration;state.focus.running=true;state.focus.endsAt=Date.now()+state.focus.remaining*1000;saveState();startTimerInterval();render();toast('Sesi fokus dimulai')}
function startTimerInterval(){if(focusInterval)clearInterval(focusInterval);if(state.focus.running&&!state.focus.endsAt)state.focus.endsAt=Date.now()+state.focus.remaining*1000;focusInterval=setInterval(()=>{const f=state.focus;if(!f.running)return;f.remaining=Math.max(0,Math.ceil((Number(f.endsAt)||Date.now())/1000-Date.now()/1000));updateTimerDisplay();if(f.remaining%5===0)saveState();if(f.remaining<=0){const wasBreak=f.duration===900;f.running=false;f.endsAt=null;if(!wasBreak){f.sessions++;f.totalMinutes+=Math.round(f.duration/60)}saveState();clearInterval(focusInterval);focusInterval=null;render();toast(wasBreak?'Waktu istirahat selesai. Siap kembali?':'Sesi fokus selesai. Ambil jeda sebentar!');try{if('Notification'in window&&Notification.permission==='granted')new Notification(wasBreak?'Orbit — Istirahat selesai':'Orbit — Sesi fokus selesai',{body:wasBreak?'Istirahat selesai. Kamu bisa mulai sesi fokus berikutnya.':'Bagus! Kamu baru saja menuntaskan sesi fokus.'})}catch(e){}}},500)}
function updateTimerDisplay(){const f=state.focus;const display=$('#timer-display');if(display)display.textContent=`${String(Math.floor(f.remaining/60)).padStart(2,'0')}:${String(f.remaining%60).padStart(2,'0')}`;const shell=$('#timer-shell');if(shell){shell.style.setProperty('--timer-progress',`${100*f.remaining/Math.max(1,f.duration)}%`);shell.style.setProperty('--timer-value',`${100*f.remaining/Math.max(1,f.duration)}%`);}const sessions=$('#focus-sessions');if(sessions)sessions.textContent=f.sessions;const minutes=$('#focus-minutes');if(minutes)minutes.textContent=f.totalMinutes}
function isAppStandalone(){return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}
async function installPWA(){if(isAppStandalone()){toast('Orbit sudah berjalan sebagai aplikasi');return}if(deferredInstallPrompt){const promptEvent=deferredInstallPrompt;deferredInstallPrompt=null;try{await promptEvent.prompt();const choice=await promptEvent.userChoice;toast(choice&&choice.outcome==='accepted'?'Orbit berhasil dipasang.':'Instalasi belum dilanjutkan.')}catch(e){toast('Dialog instalasi tidak dapat dibuka. Coba melalui menu Chrome.')}if(view==='settings')render();return}if(location.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(location.hostname)){toast('PWA perlu diakses melalui tautan HTTPS sebelum bisa dipasang.');return}toast('Jika dialog belum muncul, buka menu Chrome ⋮ lalu pilih Instal aplikasi jika tersedia.')}
function setView(next){view=next;closeModal();render();$('#sidebar')?.classList.remove('open');$('#mobile-overlay')?.classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
function handleAction(action,el,eventObj){const id=el.dataset.id;switch(action){case'toggle-menu':$('#sidebar')?.classList.toggle('open');$('#mobile-overlay')?.classList.toggle('show');break;case'open-search':openSearch();break;case'new-task':openTaskModal(null,view==='project'?{projectId:selectedProjectId}:view==='calendar'?{startDate:selectedDate,due:selectedDate}:{});break;case'new-inbox-item':openInboxItemModal();break;case'inbox-filter':inboxFilter=el.dataset.filterInbox||'all';render();break;case'move-inbox-task':{const item=state.inbox.find(x=>x.id===id);if(item&&item.type==='task'){editingInboxId=id;openTaskModal(null,{title:item.title,details:item.content||''})}break}case'delete-inbox-item':{const item=state.inbox.find(x=>x.id===id);if(item&&confirm(`Hapus item "${item.title}" dari Inbox?`)){state.inbox=state.inbox.filter(x=>x.id!==id);saveState();render();toast('Item dihapus dari Inbox')}break}case'toggle-checklist':{const t=state.tasks.find(t=>t.id===id);const sub=t?.checklist?.find(x=>x.id===el.dataset.subid);if(t&&sub){sub.done=!sub.done;t.updatedAt=new Date().toISOString();saveState();render();}break}case'edit-task':openTaskModal(id);break;case'toggle-task':toggleTask(id);break;case'delete-task':removeTask(id);break;case'archive-task':archiveTask(id,true);break;case'restore-task':archiveTask(id,false);break;case'set-task-status':{const t=state.tasks.find(t=>t.id===id);if(t){t.status=el.dataset.status;t.updatedAt=new Date().toISOString();t.completedAt=t.status==='done'?t.updatedAt:'';saveState();render();toast('Status tugas diperbarui')}break}case'new-project':openProjectModal();break;case'edit-project':openProjectModal(id);break;case'open-project':selectedProjectId=id;setView('project');break;case'new-note':addNote();break;case'select-note':selectedNote=id;notesPreviewMode=false;render();break;case'toggle-note-pin':{const n=state.notes.find(n=>n.id===id);if(n){n.pinned=!n.pinned;saveState();render();toast(n.pinned?'Catatan disematkan':'Pin dilepas')}break}case'toggle-note-preview':notesPreviewMode=!notesPreviewMode;render();break;case'delete-note':{const n=state.notes.find(n=>n.id===id);if(!n)return;if(!confirm(`Hapus catatan "${n.title||'Tanpa judul'}"?`))return;state.notes=state.notes.filter(n=>n.id!==id);selectedNote=state.notes[0]?.id||null;saveState();render();toast('Catatan dihapus');break}case'calendar-prev':monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);render();break;case'calendar-next':monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);render();break;case'calendar-today':selectedDate=dateKey();monthCursor=new Date();monthCursor.setDate(1);render();break;case'calendar-day':selectedDate=el.dataset.date;render();break;case'add-calendar-task':openTaskModal(null,{due:selectedDate});break;case'new-habit':openHabitModal();break;case'habit-month-prev':habitMonthCursor=new Date(habitMonthCursor.getFullYear(),habitMonthCursor.getMonth()-1,1);render();break;case'habit-month-next':{const next=new Date(habitMonthCursor.getFullYear(),habitMonthCursor.getMonth()+1,1),cur=new Date();cur.setDate(1);cur.setHours(0,0,0,0);if(next<=cur)habitMonthCursor=next;render();break}case'habit-month-current':{const now=new Date();habitMonthCursor=new Date(now.getFullYear(),now.getMonth(),1);render();break}case'install-app':installPWA();break;case'toggle-habit':{const h=state.habits.find(h=>h.id===id);if(h){const k=el.dataset.date||dateKey();if(k>dateKey()){toast('Check-in untuk tanggal mendatang belum tersedia');break}h.logs=h.logs&&typeof h.logs==='object'?h.logs:{};h.logs[k]=h.logs[k]!==true;if(!h.logs[k])delete h.logs[k];saveState();render();toast(h.logs[k]?'Kebiasaan ditandai selesai':'Tanda kebiasaan dibatalkan')}break}case'delete-habit':{const h=state.habits.find(h=>h.id===id);if(h&&confirm(`Hapus kebiasaan "${h.name}" dan riwayatnya?`)){state.habits=state.habits.filter(x=>x.id!==id);saveState();render();toast('Kebiasaan dihapus')}break}case'new-goal':openGoalModal();break;case'goal-adjust':{const g=state.goals.find(g=>g.id===id);if(g){g.progress=Math.max(0,Math.min(100,g.progress+Number(el.dataset.delta)));saveState();render()}break}case'delete-goal':{const g=state.goals.find(g=>g.id===id);if(g&&confirm(`Hapus tujuan "${g.title}"?`)){state.goals=state.goals.filter(x=>x.id!==id);saveState();render();toast('Tujuan dihapus')}break}case'focus-toggle':if(state.focus.running){state.focus.remaining=Math.max(0,Math.ceil((Number(state.focus.endsAt)||Date.now())/1000-Date.now()/1000));state.focus.running=false;state.focus.endsAt=null;saveState();clearInterval(focusInterval);focusInterval=null;render();toast('Sesi dijeda')}else timerStart();break;case'focus-reset':state.focus.running=false;state.focus.endsAt=null;state.focus.remaining=state.focus.duration;saveState();clearInterval(focusInterval);focusInterval=null;render();toast('Timer direset');break;case'focus-duration':state.focus.running=false;state.focus.endsAt=null;state.focus.duration=Number(el.dataset.seconds)||1500;state.focus.remaining=state.focus.duration;saveState();clearInterval(focusInterval);focusInterval=null;render();break;case'toggle-theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';saveState();render();toast('Tema: '+(state.settings.theme==='dark'?'gelap':'terang'));break;case'export-data':exportData();break;case'import-data':$('#import-file').click();break;case'reset-data':if(confirm('Yakin ingin menghapus semua data Orbit di browser ini? Tindakan ini tidak bisa dibatalkan. Ekspor cadangan lebih dulu bila diperlukan.')){state=defaultState();selectedNote=state.notes[0]?.id||null;selectedProjectId=null;if(focusInterval){clearInterval(focusInterval);focusInterval=null}saveState();render();toast('Ruang kerja berhasil direset')}break;case'settings-tab':settingsTab=el.dataset.tab;render();break;case'search-task':closeModal();view='tasks';taskFilter='all';taskSearch='';taskProjectFilter='';render();setTimeout(()=>{const row=$(`[data-task-row="${CSS.escape(id)}"]`);row?.scrollIntoView({behavior:'smooth',block:'center'});row?.animate([{background:'var(--accent-2)'},{background:'transparent'}],{duration:1000})},40);break;case'search-note':closeModal();selectedNote=id;view='notes';notesPreviewMode=false;render();break;case'search-project':closeModal();selectedProjectId=id;setView('project');break;case'close-modal':closeModal();break;case'backdrop-close':if(el===eventObj?.target)closeModal();break}}
document.addEventListener('click',e=>{const viewBtn=e.target.closest('[data-view]');if(viewBtn){e.preventDefault();setView(viewBtn.dataset.view);return}const filter=e.target.closest('[data-filter]');if(filter){taskFilter=filter.dataset.filter;render();return}if(e.target.id==='mobile-overlay'){$('#sidebar')?.classList.remove('open');$('#mobile-overlay')?.classList.remove('show');return}const actionEl=e.target.closest('[data-action]');if(actionEl){if(actionEl.dataset.action==='backdrop-close'&&actionEl!==e.target)return;e.preventDefault();handleAction(actionEl.dataset.action,actionEl,e);return}const projectCard=e.target.closest('.project-card[data-id]');if(projectCard){selectedProjectId=projectCard.dataset.id;setView('project')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalType){closeModal();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key.toLowerCase()==='n'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!modalType){e.preventDefault();openTaskModal() }if(e.key==='Enter'&&e.target.matches('.project-card[data-action="open-project"]')){selectedProjectId=e.target.dataset.id;setView('project')}});
document.addEventListener('submit',e=>{const submittedFormId=e.target instanceof HTMLFormElement?e.target.getAttribute('id'):'';if(submittedFormId==='modal-form'){e.preventDefault();submitModal(e.target)}if(submittedFormId==='quick-add-form'){e.preventDefault();const input=$('#quick-add-input');const title=(input?.value||'').trim();if(!title)return;const now=new Date().toISOString();state.tasks.unshift({id:uid(),title,details:'',due:dateKey(),priority:'medium',status:'todo',projectId:'',tags:[],createdAt:now,updatedAt:now,archived:false});saveState();render();toast('Tugas ditambahkan ke daftar hari ini')}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){const pos=e.target.selectionStart;taskSearch=e.target.value;const page=$('#page-content');if(page){const y=window.scrollY;const active=$('#task-sort')?.value||'';page.innerHTML=renderTaskPage(view);const newSearch=$('#task-search');if(newSearch){newSearch.focus();newSearch.setSelectionRange(pos,pos)}const sort=$('#task-sort');if(sort)sort.value=active;window.scrollTo(0,y)}}if(e.target.id==='note-search'){const pos=e.target.selectionStart;noteSearch=e.target.value;const page=$('#page-content');if(page){page.innerHTML=renderNotePage();const input=$('#note-search');if(input){input.focus();input.setSelectionRange(pos,pos)}}}if(e.target.id==='note-title')updateNoteField('title',e.target.value);if(e.target.id==='note-content')updateNoteField('content',e.target.value);if(e.target.id==='note-tags')updateNoteField('tags',e.target.value);if(e.target.id==='global-search'){const results=$('#search-results');if(results)results.innerHTML=searchResults(e.target.value)}});
document.addEventListener('change',e=>{if(e.target.id==='task-sort'){taskProjectFilter=e.target.value;const page=$('#page-content');if(page){const scroll=window.scrollY;page.innerHTML=renderTaskPage(view);window.scrollTo(0,scroll)}}if(e.target.id==='import-file'&&e.target.files?.[0])importData(e.target.files[0]);if(e.target.id==='theme-select'){state.settings.theme=['auto','light','dark'].includes(e.target.value)?e.target.value:'auto';saveState();render();toast('Preferensi tema diperbarui')}});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;if(view==='settings')render()});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('Orbit berhasil dipasang sebagai aplikasi');if(view==='settings')render()});if('serviceWorker'in navigator&&/^(https?:)$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});setTheme();render();if(window.matchMedia){const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');themeQuery.addEventListener?.('change',()=>{if(!state.settings.theme||state.settings.theme==='auto')setTheme()})}if(state.focus.running)startTimerInterval();
})();
</script>
